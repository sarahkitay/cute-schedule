<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Typography: Inter (UI), JetBrains Mono (time) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512.png" />
    <meta name="description" content="PROYOU is a personal schedule app with an AI coach you can type or talk to." />
    <meta name="theme-color" content="#fff8f7" />
    <meta name="color-scheme" content="light" />
    
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PROYOU" />
    <link rel="apple-touch-icon" sizes="192x192" href="./pwa-192.png" />
    
    <!-- Allow pinch-zoom (WCAG 1.4.4). Form fields use at least 16px so iOS does not auto-zoom on focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json" />
    
    <title>proyou</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" class="boot-splash" aria-hidden="true">
        <img src="./pyiconnobubble.png" alt="" width="96" height="96" class="boot-splash__logo" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Early SW install so push can work as soon as the user enables notifications (idempotent with notifications.js)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
